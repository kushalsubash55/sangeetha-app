<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permission Check</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="form-title">
        <div class="brand-lockup">
          <img class="brand-logo" src="./slk-logo.svg" alt="SLK - accelerating growth" />
        </div>

        <p class="eyebrow">Entry Form</p>
        <h1 id="form-title">Permission Check</h1>
        <p class="intro">Enter your full name and age, then click the permitted button.</p>

        <form id="entry-form" class="entry-form">
          <label class="field">
            <span>Full Name</span>
            <input
              id="full-name"
              name="fullName"
              type="text"
              placeholder="Enter your full name"
              required
            />
          </label>

          <label class="field">
            <span>Age</span>
            <input
              id="age"
              name="age"
              type="number"
              min="0"
              placeholder="Enter your age"
              required
            />
          </label>

          <button id="permitted-button" type="submit">Permited Button</button>
        </form>

        <section class="entries-panel" aria-labelledby="entries-title">
          <div class="entries-header">
            <h2 id="entries-title">Saved Entries</h2>
            <button id="clear-entries" type="button" class="secondary-button">Clear All</button>
          </div>
          <p id="entries-empty" class="entries-empty">No entries stored yet for today.</p>
          <div id="entries-list" class="entries-list"></div>
        </section>

      </section>
    </main>

    <div id="dialog-backdrop" class="dialog-backdrop hidden" aria-hidden="true">
      <div
        class="dialog-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
        aria-describedby="dialog-message"
      >
        <h2 id="dialog-title">Permission Result</h2>
        <p id="dialog-message"></p>
        <button id="dialog-close" type="button">OK</button>
      </div>
    </div>

    <script>
      const form = document.getElementById("entry-form");
      const fullNameInput = document.getElementById("full-name");
      const ageInput = document.getElementById("age");
      const dialogBackdrop = document.getElementById("dialog-backdrop");
      const dialogMessage = document.getElementById("dialog-message");
      const dialogClose = document.getElementById("dialog-close");
      const entriesList = document.getElementById("entries-list");
      const entriesEmpty = document.getElementById("entries-empty");
      const clearEntriesButton = document.getElementById("clear-entries");
      const storageKey = "slk-permission-entries";

      const readEntries = () => {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) ?? [];
        } catch (error) {
          return [];
        }
      };

      const writeEntries = (entries) => {
        localStorage.setItem(storageKey, JSON.stringify(entries));
      };

      const renderEntries = () => {
        const entries = readEntries();
        entriesList.innerHTML = "";

        if (entries.length === 0) {
          entriesEmpty.hidden = false;
          return;
        }

        entriesEmpty.hidden = true;

        entries.forEach((entry) => {
          const item = document.createElement("article");
          item.className = "entry-item";
          item.innerHTML = `
            <p class="entry-name">${entry.fullName}</p>
            <p class="entry-meta">Age: ${entry.age}</p>
            <p class="entry-meta">Status: ${entry.status}</p>
          `;
          entriesList.appendChild(item);
        });
      };

      const showDialog = (message) => {
        dialogMessage.textContent = message;
        dialogBackdrop.classList.remove("hidden");
        dialogBackdrop.setAttribute("aria-hidden", "false");
      };

      const hideDialog = () => {
        dialogBackdrop.classList.add("hidden");
        dialogBackdrop.setAttribute("aria-hidden", "true");
      };

      dialogClose.addEventListener("click", hideDialog);

      dialogBackdrop.addEventListener("click", (event) => {
        if (event.target === dialogBackdrop) {
          hideDialog();
        }
      });

      clearEntriesButton.addEventListener("click", () => {
        localStorage.removeItem(storageKey);
        renderEntries();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const fullName = fullNameInput.value.trim();
        const age = Number(ageInput.value);

        let message = "";
        let status = "";

        if (!fullName) {
          showDialog("Please enter your full name.");
          return;
        }

        if (Number.isNaN(age)) {
          message = "Please enter a valid age.";
          showDialog(message);
          return;
        }

        if (age < 40) {
          message = "You are good to enter";
          status = "Allowed";
        } else {
          message = "Not allowed to Enter";
          status = "Not Allowed";
        }

        const entries = readEntries();
        entries.unshift({
          fullName,
          age,
          status,
          createdAt: new Date().toISOString(),
        });
        writeEntries(entries);
        renderEntries();
        form.reset();
        showDialog(message);
      });

      renderEntries();
    </script>
  </body>
</html>
